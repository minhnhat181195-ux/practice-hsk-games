<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập tiếng Trung · Vùng Tự Trị Của Cô Oanh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif+SC:wght@600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{--blue:#1E5FA8;--blue-deep:#123E73;--teal:#2A9D8F;--ink:#1F2A37;--ink-soft:#5B6675;--bg:#F4F7FB}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;padding:0 16px 60px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto}
header{text-align:center;padding:44px 0 26px}
.seal{display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;border:2.5px solid var(--blue);border-radius:14px;color:var(--blue);font-family:"Ma Shan Zheng",serif;font-size:32px;transform:rotate(-4deg);margin-bottom:16px;background:#fff;box-shadow:3px 4px 0 rgba(30,95,168,.16)}
h1{font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:clamp(30px,7vw,44px);color:var(--blue-deep);letter-spacing:2px}
.sub{color:var(--ink-soft);margin-top:6px}
.brand{margin-top:10px;font-size:12px;letter-spacing:3px;color:var(--teal);font-weight:700}
.lesson{display:flex;align-items:center;gap:16px;background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px;text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(18,62,115,.08);border:1.5px solid transparent;transition:.15s}
.lesson:active,.lesson:hover{border-color:var(--blue);transform:translateY(-1px)}
.num{flex:none;width:52px;height:52px;border-radius:12px;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1}
.num small{font-size:10px;font-weight:600;opacity:.85}
.cn{font-family:"Noto Serif SC",serif;font-size:20px;color:var(--blue-deep)}
.vi{font-size:14px;color:var(--ink-soft)}
.go{margin-left:auto;color:var(--blue);font-size:22px}
.note{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">学</div>
    <h1>课后练习</h1>
    <div class="sub">Bài tập sau giờ học · chọn bài để bắt đầu</div>
    <div class="brand">VÙNG TỰ TRỊ CỦA CÔ OANH</div>
  </header>

  <!-- Thêm bài mới: copy 1 khối <a class="lesson">…</a> bên dưới, đổi số bài, tên file và tên bài -->
  <a class="lesson" href="bai5.html">
    <div class="num"><small>BÀI</small>5</div>
    <div><div class="cn">就买这件吧</div><div class="vi">Mua chiếc áo này đi</div></div>
    <div class="go">›</div>
  </a>

  <div class="note">Mật khẩu lớp do cô giáo cung cấp.</div>
</div>
</body>
</html>
